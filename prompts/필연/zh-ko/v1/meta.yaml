work: 필연
lang: zh-ko
version: v1
source_lang: 중국어
target_lang: 한국어
notes: 범용 중한 소설 프롬프트. STEP1=번역핵심정보 추출(JSON), STEP2=기본 번역, STEP3=장르
  강화·말투, STEP4=검토·개선, STEP5=한국독자 각색(최종). 각 단계 <o>JSON</o> 출력, 번역
  단계는 json 필드만 추출해 다음 단계로 전달.
steps:
- id: 1
  name: 번역핵심정보 추출
  file: step1.txt
  inputs:
  - source
  - glossary
  extract: tag:o
- id: 2
  name: 기본 번역
  file: step2.txt
  inputs:
  - source
  - glossary
  - step1
  extract: json:translation
- id: 3
  name: 장르 강화·말투
  file: step3.txt
  inputs:
  - glossary
  - step1
  - step2
  extract: json:enhanced_translation
- id: 4
  name: 검토·개선
  file: step4.txt
  inputs:
  - source
  - glossary
  - step1
  - step3
  extract: json:adapted_translation
- id: 5
  name: 한국독자 각색(최종)
  file: step5.txt
  inputs:
  - glossary
  - step1
  - step4
  extract: json:final_translation
  output: final
