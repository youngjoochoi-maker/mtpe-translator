# ── MTPE 번역 파이프라인 전역 설정 ────────────────────────────
# 프롬프트는 작품별·언어별·버전별 번들로 관리한다:
#   prompts/<작품>/<언어쌍>/<버전>/  (step1~5.txt + meta.yaml)
# 버전 미지정 시 최신 버전을 자동 선택한다.

prompts_root: prompts

# 기본 선택 (CLI --work/--lang/--version 으로 덮어쓸 수 있음)
default_work: 장저견
default_lang: zh-ko
default_version: null        # null => 최신(latest) 버전 자동 선택

# ── 모델 (LiteLLM 모델 문자열, 모든 LLM 선택 가능) ──
#   Anthropic : claude-opus-4-8 / claude-sonnet-4-6 / claude-haiku-4-5-20251001
#   OpenAI    : gpt-4o / gpt-4.1 / o3 ...   Google: gemini/gemini-2.5-pro
# API 키는 환경변수: ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY
default_model: gemini/gemini-3.1-pro-preview
temperature: 0.3
# gemini-2.5/3.x 등 추론(thinking) 모델은 내부 사고에 토큰을 써서, 한도가 낮으면 본문이 끝에서 잘릴 수 있음 → 넉넉히.
# Gemini 3.1 Pro 출력 상한이 65536 이라 그 끝까지 사용(만 자 연재 등 초장편 회차 잘림 방지).
max_tokens: 65536

# 동시에 번역할 회차 수(1~6). 한 회차 안의 단계는 순차. 제약은 PC 성능이 아니라 모델 API 분당 한도(429)
# → 429 가 잦으면 낮추고, 한도가 넉넉하면 올림. UI 에서 실행할 때마다 바꿀 수도 있음.
concurrency: 3

# ── 자동 점검·재추출 (n8n 배치 자동화 + 앱 번역 탭 '회차 실행') ──
# 재추출했거나 확인이 필요한 회차는 작품 폴더의 '자동점검_기록.csv' 에 기록(앱 화면엔 알림 없음, 로그 창에만 표시).
# 최종본에 ① 번역 안 된 원문 줄(한글 없이 한자만 있는 줄) ② 본문 사이 빈 줄 ③ 출력 잘림(⚠️ 자동경고)이 있으면
# 그 회차만 자동으로 다시 추출(max_retries 번까지)하고, 문제가 가장 적은 결과를 고른 뒤
# 자동 정리(위 줄들 삭제)를 해서 final.txt·docx 를 만든다. 정리 전 원본은 final_raw.txt 로 보관.
# 제목 줄(§§§…·#제N화) 바로 아래 빈 줄 1칸은 정리만 하고 재추출 사유로는 세지 않음.
# 재추출 뒤에도 잘림이 남으면 시트 '오류메시지'·슬랙에 '확인 필요'로 표시. AI 비용은 재추출만큼 늘어남.
postcheck:
  enabled: true
  langs: [zh-ko]     # 적용할 언어쌍(문피아 중한 5개 세트는 모두 '빈 줄 없이' 규칙)
  max_retries: 1     # 회차당 자동 재추출 횟수

# 모든 단계 공통 시스템 프롬프트
system_prompt: |
  당신은 전문 번역 엔진입니다. 각 단계의 지시사항을 정확히 따르고,
  요청된 산출물만 출력하세요. (지시에 출력 형식이 명시되면 그 형식을 따릅니다.)

# 입력 자료 자동 첨부 시 사용할 한국어 라벨 (step* 키는 번들 단계 수에 맞게 사용)
input_labels:
  source: 원문
  glossary: 설정집(TB)
  step1: STEP 1 분석(JSON)
  step2: STEP 2 분석
  step3: STEP 3 번역본
  step4: STEP 4 개선 기준
  step5: STEP 5 최종본
