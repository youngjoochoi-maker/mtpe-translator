name: Build 분권 API Windows EXE

# 담당자 PC(Windows)에서 실행할 분권 API 서버 .exe 를 자동 빌드합니다.
# 트리거: 수동 실행 또는 api-v* 태그 푸시
on:
  workflow_dispatch:
  push:
    tags:
      - 'api-v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart python-docx openpyxl
          pip install pyinstaller

      - name: 빌드 (PyInstaller)
        run: pyinstaller novel_splitter_api.spec --noconfirm

      - name: 빌드 산출물 확인
        shell: bash
        run: ls -lh dist/

      - name: Release용 사본 준비 (ASCII 파일명)
        if: startsWith(github.ref, 'refs/tags/api-v')
        shell: bash
        run: cp "dist/분권API.exe" "dist/NovelSplitterAPI.exe"

      # Release 는 아티팩트 저장 용량과 무관하므로 먼저 첨부한다.
      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/api-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelSplitterAPI.exe

      # 아티팩트 업로드는 용량 초과 시 실패해도 Release 전달에 영향 없게 한다.
      - name: 아티팩트 업로드
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 분권API-windows
          path: dist/분권API.exe
