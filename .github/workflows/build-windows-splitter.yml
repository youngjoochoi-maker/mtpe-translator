name: Build 소설분권 (Windows EXE + macOS app)

# 윈도우 PC 없이도 GitHub 가 윈도우에서 소설 분권 프로그램 .exe 를 자동 빌드합니다.
# (PyInstaller 는 크로스 컴파일이 불가하여 반드시 Windows 에서 빌드해야 함)
#
# 트리거: 수동 실행(Actions 탭의 Run workflow) 또는 splitter-v* 태그 푸시
on:
  workflow_dispatch:
  push:
    tags:
      - 'splitter-v*'

jobs:
  build:
    runs-on: windows-latest
    # 저장소 기본 워크플로 권한이 'read' 라서, Release 생성을 위해
    # contents: write 를 이 워크플로에만 명시적으로 부여한다.
    # (없으면 Release 첨부 단계가 "Resource not accessible by integration" 로 실패)
    permissions:
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 분권 프로그램에 필요한 것만 설치(전체 requirements.txt 는 불필요하게 무거움)
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-docx openpyxl
          pip install pyinstaller

      - name: 빌드 (PyInstaller)
        run: pyinstaller novel_splitter.spec --noconfirm

      - name: 빌드 산출물 확인
        shell: bash
        run: ls -lh dist/

      - name: 아티팩트 업로드 (.exe 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: 소설분권-windows
          path: dist/소설분권.exe
          if-no-files-found: error

      # Release 첨부용 사본을 ASCII 이름으로 만든다.
      # (한글 파일명을 그대로 올리면 Release 자산명이 'default.exe' 로 깨짐)
      - name: Release용 사본 준비
        if: startsWith(github.ref, 'refs/tags/splitter-v')
        shell: bash
        run: cp "dist/소설분권.exe" "dist/NovelSplitter.exe"

      # 태그(splitter-v*) 푸시면 Release 에도 첨부
      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/splitter-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelSplitter.exe

  # ── macOS .app (같은 태그로 Release 에 함께 첨부) ──
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-docx openpyxl
          pip install pyinstaller

      - name: 빌드 (.app)
        run: pyinstaller novel_splitter.spec --noconfirm

      - name: ad-hoc 서명 (Gatekeeper '손상됨' 방지)
        continue-on-error: true   # 서명이 실패해도 zip 업로드는 진행 (PyInstaller 자체 ad-hoc 서명이 이미 들어감)
        run: |
          APP="dist/소설분권.app"
          xattr -cr "$APP" || true
          # 1) 내부 Mach-O(dylib/so/실행파일)부터 개별 ad-hoc 서명 (--deep 은 Qt 프레임워크 구조에서 실패하는 경우가 있음)
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f" || echo "::warning::서명 실패(계속): $f"
            fi
          done
          # 2) 프레임워크 번들 서명
          find "$APP" -type d -name '*.framework' -print0 | while IFS= read -r -d '' fw; do
            codesign --force --sign - "$fw" || echo "::warning::프레임워크 서명 실패(계속): $fw"
          done
          # 3) 앱 번들 전체 서명 + 검증
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: .app 압축 (Release 자산용, ASCII 이름)
        run: |
          ls -la dist/
          cd dist && ditto -c -k --keepParent "소설분권.app" "NovelSplitter-mac.zip"

      - name: 아티팩트 업로드 (.app)
        uses: actions/upload-artifact@v4
        with:
          name: NovelSplitter-mac
          path: dist/NovelSplitter-mac.zip

      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/splitter-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelSplitter-mac.zip
