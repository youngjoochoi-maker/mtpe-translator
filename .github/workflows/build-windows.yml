name: Build MTPE (Windows EXE + macOS app)

# 윈도우 PC 없이도 GitHub 가 윈도우에서 .exe 를 자동 빌드합니다.
# 트리거: 수동 실행(Actions 탭의 Run workflow) 또는 v* 태그 푸시
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # Release 첨부에 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 — 데스크톱 앱 (PyInstaller)
        run: pyinstaller mtpe.spec --noconfirm

      - name: 빌드 — 자동화 API 서버 (PyInstaller)
        run: pyinstaller mtpe_api.spec --noconfirm

      - name: 아티팩트 업로드 (.exe 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: MTPE-windows
          path: |
            dist/MTPE.exe
            dist/MTPEApi.exe

      # 태그(v*) 푸시면 Release 에도 첨부(데스크톱 앱 + API 서버)
      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MTPE.exe
            dist/MTPEApi.exe

  # ── macOS .app (같은 태그로 Release 에 함께 첨부) ──
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 — 데스크톱 앱 (.app)
        run: pyinstaller mtpe.spec --noconfirm

      - name: ad-hoc 서명 (Gatekeeper '손상됨' 방지)
        continue-on-error: true   # 서명이 실패해도 zip 업로드는 진행 (PyInstaller 자체 ad-hoc 서명이 이미 들어감)
        run: |
          APP="dist/MTPE.app"
          xattr -cr "$APP" || true
          # 1) 내부 Mach-O(dylib/so/실행파일)부터 개별 ad-hoc 서명 (--deep 은 Qt 프레임워크 구조에서 실패하는 경우가 있음)
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f" || echo "::warning::서명 실패(계속): $f"
            fi
          done
          # 2) 프레임워크 번들 서명
          find "$APP" -type d -name '*.framework' -print0 | while IFS= read -r -d '' fw; do
            codesign --force --sign - "$fw" || echo "::warning::프레임워크 서명 실패(계속): $fw"
          done
          # 3) 앱 번들 전체 서명 + 검증
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: .app 압축 (Release 자산용, ASCII 이름)
        run: |
          ls -la dist/
          cd dist && ditto -c -k --keepParent "MTPE.app" "MTPE-mac.zip"

      - name: 아티팩트 업로드 (.app)
        uses: actions/upload-artifact@v4
        with:
          name: MTPE-mac
          path: dist/MTPE-mac.zip

      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTPE-mac.zip
