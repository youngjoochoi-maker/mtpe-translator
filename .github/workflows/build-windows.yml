name: Build Windows EXE

# 윈도우 PC 없이도 GitHub 가 윈도우에서 .exe 를 자동 빌드합니다.
# 트리거: 수동 실행(Actions 탭의 Run workflow) 또는 v* 태그 푸시
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 (PyInstaller)
        run: pyinstaller mtpe.spec --noconfirm

      - name: 아티팩트 업로드 (.exe 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: MTPE-windows
          path: dist/MTPE.exe

      # 태그(v*) 푸시면 Release 에도 첨부
      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTPE.exe
