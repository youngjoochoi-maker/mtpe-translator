name: Build MTPE (Windows EXE + macOS app)

# 윈도우 PC 없이도 GitHub 가 윈도우에서 .exe 를 자동 빌드합니다.
# 트리거: 수동 실행(Actions 탭의 Run workflow) 또는 v* 태그 푸시
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # Release 첨부에 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 — 데스크톱 앱 (PyInstaller)
        run: pyinstaller mtpe.spec --noconfirm

      - name: 빌드 — 자동화 API 서버 (PyInstaller)
        run: pyinstaller mtpe_api.spec --noconfirm

      - name: 아티팩트 업로드 (.exe 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: MTPE-windows
          path: |
            dist/MTPE.exe
            dist/MTPEApi.exe

      # 태그(v*) 푸시면 Release 에도 첨부(데스크톱 앱 + API 서버)
      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MTPE.exe
            dist/MTPEApi.exe

  # ── macOS .app (같은 태그로 Release 에 함께 첨부) ──
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 — 데스크톱 앱 (.app)
        run: pyinstaller mtpe.spec --noconfirm

      - name: 서명 상태 확인 (PyInstaller 기본 ad-hoc 서명 사용, 추가 서명 안 함)
        continue-on-error: true
        run: |
          codesign -dv "dist/MTPE.app" 2>&1 | head -5
          codesign --verify --verbose=2 "dist/MTPE.app" || echo "::warning::codesign verify 실패(참고용)"

      - name: .app 압축 (Release 자산용, ASCII 이름)
        run: |
          ls -la dist/
          mkdir -p "dist/MTPE-mac"
          mv "dist/MTPE.app" "dist/MTPE-mac/"
          cp "tools/mac_처음_실행하기.command" "dist/MTPE-mac/처음 실행하기.command"
          chmod +x "dist/MTPE-mac/처음 실행하기.command"
          cd dist && ditto -c -k --keepParent "MTPE-mac" "MTPE-mac.zip"

      - name: 아티팩트 업로드 (.app)
        uses: actions/upload-artifact@v4
        with:
          name: MTPE-mac
          path: dist/MTPE-mac.zip

      - name: Release 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTPE-mac.zip
